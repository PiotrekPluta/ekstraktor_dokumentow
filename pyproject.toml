[project]
name = "extractor"
version = "0.1.0"
description = "CLI that extracts structured fields from an unstructured document archive using a local LLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "charset-normalizer>=3.5.1",
    "httpx>=0.28.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "tokenizers>=0.23.2",
    "typer>=0.27.2",
]

[project.scripts]
extractor = "extractor.cli:main"

[dependency-groups]
datagen = [
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
