# A real `./setup.sh` + `extractor run --limit 1` against the actual
# pinned Bielik model, on real macOS arm64 (GitHub's `macos-14` runner is
# an M1) — correctness only, never performance, same caveat as
# macos.yml's `pytest-macos-arm64` job (no working Metal under Apple's
# virtualisation here, docs/PROJECT_NOTES.md §5).
#
# workflow_dispatch only, in its own file (not a job in macos.yml gated by
# `if: github.event_name == 'workflow_dispatch'`): that gating still left
# a run of this workflow — with this job skipped — firing on every push/PR,
# which is noise for something that's never going to execute there. A
# separate file with only `workflow_dispatch` in `on:` means nothing here
# runs at all until someone deliberately triggers it from the Actions tab.
#
# Uses config/ci_macos.toml, not config/default.toml: same pinned model,
# but with `-ngl 0` forced (see that file's own comments for why — GitHub's
# arm64 runners don't have working Metal, so this can't just rely on
# platform.system() the way a real M1 could) and a generous timeout_s for
# the runner's slower, shared 3-core CPU. Downloads the real ~5GB GGUF
# every run, which is why this stays manual-only rather than joining
# macos.yml's cheap, every-push job.

name: macOS arm64 (M1) smoke e2e

on:
  workflow_dispatch:

jobs:
  smoke-e2e-macos-arm64:
    name: setup.sh + real run --limit 1
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run setup.sh (fetch pinned model + llama-server, smoke-test the backend)
        env:
          EXTRACTOR_CONFIG_PATH: config/ci_macos.toml
        run: ./setup.sh

      - name: Real end-to-end run against data/corpus (--limit 1)
        run: |
          uv run extractor run \
            --input data/corpus --db /tmp/ci.sqlite \
            --limit 1 --config config/ci_macos.toml

      - name: Report
        run: uv run extractor report --db /tmp/ci.sqlite
