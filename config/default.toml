# Default run configuration.
#
# Model/backend pinned for llama_server (Stage 5b, docs/PROJECT_NOTES.md §4):
# speakleash/Bielik-4.5B-v3.0-Instruct, Q8_0 GGUF, Apache 2.0. Verified
# directly against the Hugging Face API on 2026-09-15 (not carried over
# from PROJECT_NOTES.md's possibly-stale notes) — model_revision and
# model_sha256 below are the real pinned commit and file digest, not
# placeholders. Bielik 3.1 (announced for June 2026) was not released as
# of this check, confirming the 3.0 line is still the right pin.
#
# Ollama pin (Stage 5c) verified directly against Ollama's own registry API
# (registry.ollama.ai, Docker-registry-v2-compatible) on 2026-09-15: the
# model layer's digest is sha256:562f2291... — identical to the GGUF
# already pinned above for llama_server, confirming both backends serve the
# exact same published weights, not just "the same model" in name.

[run]
workers = 4
# limit / budget: unset = unlimited. Set as integers to cap a run.
# limit = 5
# budget = 100000
# Cap on generated tokens per LLM call (LLMRequest.max_tokens) and the fixed
# worst-case component of every token_ledger reservation (Stage 7). 300 is
# generous for one compact JSON object with a one-sentence summary — an
# order of magnitude below the ~1500-2000 token/doc input budget (§4).
max_output_tokens = 300

[backend]
# One of: "fake" (tests, no network/model), "llama_server", "ollama".
name = "llama_server"

[backend.llama_server]
host = "127.0.0.1"
port = 8080
model_repo = "speakleash/Bielik-4.5B-v3.0-Instruct-GGUF"
model_revision = "3ee7b47bcd0ad7bc6a4c45bb7bad3e0b2fe066ad"  # pinned commit, not a branch
model_file = "Bielik-4.5B-v3.0-Instruct.Q8_0.gguf"
model_sha256 = "562f2291de257890adf2b4a914da8b194affe6a7a838a6b7ef3d342f306c1b7f"
model_size_bytes = 5061215424
# Server's allocated context (--ctx-size), not windowing's own char/token
# budget: 2048 leaves headroom over the ~1500-2000 token/doc design target
# (docs/PROJECT_NOTES.md §4) without allocating KV cache for the model's
# full 8192-token capability, which this tool's windowing never needs.
context_tokens = 2048

[backend.llama_server.server_binary]
# Prebuilt llama-server from a pinned ggml-org/llama.cpp release (per-commit
# "b<N>" tags with real binary assets — the "vX.Y.Z" releases do not carry
# them). Checksums computed locally after downloading each asset, not
# copied from anywhere — llama.cpp publishes no checksums file.
release_tag = "b10985"
macos_arm64_asset = "llama-b10985-bin-macos-arm64.tar.gz"
macos_arm64_sha256 = "af0c49bbc35add2cdfcdfd9b6fd1fa6d30a9087d4950561fbd6ebda37bd4fe2d"
ubuntu_x64_asset = "llama-b10985-bin-ubuntu-x64.tar.gz"
ubuntu_x64_sha256 = "9813c959e82de406cddc562fcb48a42400df330a922326cf8b547859f609ee5e"

[backend.ollama]
host = "127.0.0.1"
port = 11434
# Public, ollama-pull-able tag (not a self-made local import name) — a
# reviewer gets this via `ollama pull`. Digest is the manifest's
# ollama-content-digest header from registry.ollama.ai, not a locally
# -computed value.
model_tag = "speakleash/bielik-4.5b-v3.0-instruct:q8_0"
model_digest = "88067a36fa44882b76463bb6befd0d8593a031032495fa48b9f957c3cb23858b"
context_tokens = 2048

# USD per 1,000,000 tokens. Local backends are 0.0 — the cost mechanism
# still runs, it just always totals zero (docs/ZADANIE.md requirement 6).
[pricing.fake]
input_per_million = 0.0
output_per_million = 0.0

[pricing.llama_server]
input_per_million = 0.0
output_per_million = 0.0

[pricing.ollama]
input_per_million = 0.0
output_per_million = 0.0
